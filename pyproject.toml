[project]
name = "url-shortener"
version = "0.1.0"
description = "A URL shortener in FastAPI."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
